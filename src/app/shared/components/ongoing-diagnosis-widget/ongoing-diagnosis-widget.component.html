<aside class="diag-widget" *ngIf="visible && state">
  <button class="min-btn" (click)="close.emit()">x</button>
  <p class="kicker">{{ state.status === 'completed' ? 'Diagnosis Complete' : (state.status === 'error' ? 'Diagnosis Failed' : 'Diagnosis Running') }}</p>
  <h4>{{ titleFor(state) }}</h4>
  <p class="status">{{ state.instruction }}</p>
  <div class="bar"><div class="fill" [style.width.%]="state.status === 'running' || state.status === 'transitioning' ? state.progress : 100"></div></div>
  <button class="open-btn" (click)="open.emit()">{{ actionLabelFor(state) }}</button>
</aside>
