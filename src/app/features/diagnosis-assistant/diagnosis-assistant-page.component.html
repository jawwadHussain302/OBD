<div class="assistant-page">
  <header class="page-header">
    <div class="header-eyebrow">
      <span class="eyebrow-icon">[AI]</span>
      <span class="eyebrow-text">Diagnostic System</span>
    </div>
    <h1 class="page-title">AI Diagnosis Assistant</h1>
    <p class="page-subtitle">Select a diagnostic mode to open a dedicated analysis page.</p>
  </header>

  <div class="mode-grid">
    <button class="mode-card mode-card--primary" (click)="openFullDiagnosis()">
      <div class="card-icon-wrap card-icon-wrap--green"><span class="card-icon">FD</span></div>
      <div class="card-body">
        <div class="card-title-row">
          <h2 class="card-title">Full Diagnosis</h2>
          <span class="card-badge card-badge--auto">AUTO</span>
        </div>
        <p class="card-description">Run end-to-end diagnosis with DTCs, live data, and evidence correlation.</p>
      </div>
      <span class="card-arrow">Open</span>
    </button>

    <button class="mode-card mode-card--purple" (click)="openCatalyticConverter()">
      <div class="card-icon-wrap card-icon-wrap--purple"><span class="card-icon">CAT</span></div>
      <div class="card-body">
        <div class="card-title-row">
          <h2 class="card-title">Catalytic Converter Test</h2>
          <span class="card-badge card-badge--new">NEW</span>
        </div>
        <p class="card-description">Open dedicated catalyst analysis with O2 graph, evidence, confidence, and recommendations.</p>
      </div>
      <span class="card-arrow">Open</span>
    </button>

    <button class="mode-card mode-card--amber" (click)="openCylinderAnalysis()">
      <div class="card-icon-wrap card-icon-wrap--amber"><span class="card-icon">CYL</span></div>
      <div class="card-body">
        <div class="card-title-row">
          <h2 class="card-title">Cylinder Analysis</h2>
          <span class="card-badge card-badge--new">NEW</span>
        </div>
        <p class="card-description">Open dedicated misfire/cylinder analysis with causes, evidence, and next-test guidance.</p>
      </div>
      <span class="card-arrow">Open</span>
    </button>

    <div class="mode-card mode-card--disabled">
      <div class="card-icon-wrap card-icon-wrap--muted"><span class="card-icon">HOLD</span></div>
      <div class="card-body">
        <div class="card-title-row">
          <h2 class="card-title">Guided Diagnosis</h2>
          <span class="card-badge card-badge--soon">REDESIGN</span>
        </div>
        <p class="card-description">Guided diagnosis is being redesigned for a practical workshop workflow.</p>
      </div>
    </div>
  </div>
</div>
