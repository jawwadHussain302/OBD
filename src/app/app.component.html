<!-- NexDrive Pro — App Shell -->
<div class="app-layout">

  <nav class="sidebar">
    <!-- Logo / Brand -->
    <div class="sidebar-brand">
      <span class="brand-icon">⬡</span>
      <span class="brand-name">NexDrive Pro</span>
    </div>

    <ul class="nav-links">
      <li>
        <a routerLink="/vehicle-profile" routerLinkActive="active">
          <span class="nav-icon">⚙</span>
          <span class="nav-label">Vehicle Setup</span>
        </a>
      </li>
      <li>
        <a routerLink="/diagnosis-assistant" [class.active]="diagnosisActive()">
          <span class="nav-icon">🔬</span>
          <span class="nav-label">AI Diagnosis Assistant</span>
        </a>
      </li>
      <li>
        <a routerLink="/dashboard" routerLinkActive="active">
          <span class="nav-icon">📡</span>
          <span class="nav-label">Live Data</span>
        </a>
      </li>
      <li>
        <a routerLink="/session-replay" routerLinkActive="active">
          <span class="nav-icon">⏮</span>
          <span class="nav-label">Session Replay</span>
        </a>
      </li>
      <li>
        <a routerLink="/sessions" routerLinkActive="active">
          <span class="nav-icon">📋</span>
          <span class="nav-label">Sessions</span>
        </a>
      </li>
      <li>
        <a routerLink="/ble-debug" routerLinkActive="active">
          <span class="nav-icon">📶</span>
          <span class="nav-label">BLE Debug</span>
        </a>
      </li>
      <li *ngIf="isAdmin()">
        <a routerLink="/admin/dtc-review" routerLinkActive="active">
          <span class="nav-icon">🛡</span>
          <span class="nav-label">DTC Review</span>
        </a>
      </li>
      <li *ngIf="isAdmin()">
        <a routerLink="/admin/vehicle-review" routerLinkActive="active">
          <span class="nav-icon">V</span>
          <span class="nav-label">Vehicle Review</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="station-badge">
        <span class="led led--green"></span>
        <span>Station 04 · Online</span>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <app-global-telemetry-dock *ngIf="showTelemetryDock$ | async"></app-global-telemetry-dock>
    <router-outlet></router-outlet>
    <app-ongoing-diagnosis-widget
      *ngIf="(widgetVisible$ | async)"
      [state]="(diagnosisState$ | async) ?? null"
      [visible]="true"
      (open)="openDiagnosisWidget()"
      (close)="closeDiagnosisWidget()">
    </app-ongoing-diagnosis-widget>
  </main>

</div>
